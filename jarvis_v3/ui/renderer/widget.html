<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --c:  #ff4d4d;
  --c2: rgba(255,77,77,0.12);
  --c3: rgba(255,77,77,0.22);
  --bg: rgba(18,6,8,0.94);
  --bg2:rgba(36,8,10,0.9);
  --bdr:rgba(255,77,77,0.22);
  --txt:#ffe9e6;
  --dim:rgba(255,212,212,0.48);
  --red:#ff3a3a;
  --amb:#ffbf47;
  --fn: 'Segoe UI', system-ui, sans-serif;
  --mono:'Consolas','Courier New',monospace;
}

body {
  width:340px; height:500px;
  background:transparent;
  font-family:var(--fn);
  color:var(--txt);
  overflow:hidden;
  user-select:none;
  -webkit-app-region:no-drag;
}

.widget {
  width:340px; height:500px;
  background:var(--bg);
  border:1px solid var(--bdr);
  border-radius:6px;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(24px);
  box-shadow:0 0 55px rgba(255,77,77,0.08),inset 0 0 90px rgba(35,6,8,0.55);
}

/* corner brackets */
.widget::before,.widget::after {
  content:'';position:absolute;
  width:14px;height:14px;
  border-color:var(--c);border-style:solid;
  pointer-events:none;z-index:10;
}
.widget::before{top:5px;left:5px;border-width:1.5px 0 0 1.5px;}
.widget::after {bottom:5px;right:5px;border-width:0 1.5px 1.5px 0;}

/* scanline */
.scan {
  position:absolute;top:0;left:0;right:0;
  height:1.5px;
  background:linear-gradient(90deg,transparent,var(--c),transparent);
  opacity:.35;
  animation:scan 5s linear infinite;
  pointer-events:none;z-index:5;
}
@keyframes scan{from{top:0}to{top:100%}}

/* ── HEADER ── */
.hdr {
  display:flex;align-items:center;
  justify-content:space-between;
  padding:10px 14px 8px;
  border-bottom:1px solid var(--bdr);
  -webkit-app-region:drag;
  cursor:grab;flex-shrink:0;
}
.hdr:active{cursor:grabbing;}

.logo {display:flex;align-items:center;gap:10px;}

.orb {
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--c);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  animation:orb-pulse 3s ease-in-out infinite;
}
.orb::before {
  content:'';position:absolute;
  width:20px;height:20px;border-radius:50%;
  border:1px solid rgba(0,212,255,.35);
  animation:orb-pulse 3s ease-in-out infinite .6s;
}
.orb-core {
  width:9px;height:9px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 10px var(--c);
  animation:core 2s ease-in-out infinite;
}
@keyframes orb-pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,255,.3)}50%{box-shadow:0 0 0 5px rgba(0,212,255,0)}}
@keyframes core{0%,100%{opacity:1}50%{opacity:.55}}

.logo-txt {font-size:20px;font-weight:700;letter-spacing:5px;color:var(--c);}
.logo-sub {font-size:7.5px;letter-spacing:2px;color:var(--dim);font-family:var(--mono);margin-top:1px;}

.hdr-btns {
  display:flex;gap:5px;
  -webkit-app-region:no-drag;
}
.hbtn {
  width:24px;height:24px;
  border:1px solid var(--bdr);border-radius:3px;
  background:transparent;color:var(--dim);
  cursor:pointer;font-size:11px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.hbtn:hover{border-color:var(--c);color:var(--c);background:var(--c2);}

/* ── STATUS BAR ── */
.sbar {
  display:flex;gap:14px;align-items:center;
  padding:5px 14px;
  border-bottom:1px solid var(--bdr);
  font-family:var(--mono);font-size:9px;color:var(--dim);
  flex-shrink:0;
}
.dot {
  width:6px;height:6px;border-radius:50%;
  background:var(--c);
  box-shadow:0 0 5px var(--c);
  animation:blink 2.5s infinite;
  flex-shrink:0;
}
.dot.off{background:var(--red);box-shadow:0 0 5px var(--red);}
.dot.warn{background:var(--amb);box-shadow:0 0 5px var(--amb);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.sbar-item{display:flex;align-items:center;gap:5px;}
.sbar-right{margin-left:auto;}

/* ── WAVEFORM ── */
.wave-area {
  display:flex;align-items:center;justify-content:center;
  gap:3px;padding:8px 14px;height:52px;
  border-bottom:1px solid var(--bdr);
  cursor:pointer;transition:background .2s;flex-shrink:0;
}
.wave-area:hover{background:var(--c2);}
.wave-area.active .bar{animation:wave var(--d) ease-in-out infinite alternate;opacity:1!important;}
.bar{
  width:2.5px;border-radius:2px;
  background:var(--c);height:4px;opacity:.3;
  --d:.7s;transition:height .1s;
}
@keyframes wave{to{height:var(--h);}}
.mic-hint{font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:2px;margin-left:8px;}

/* ── MESSAGES ── */
.msgs {
  flex:1;overflow-y:auto;
  padding:10px 12px;
  display:flex;flex-direction:column;gap:8px;
  scrollbar-width:thin;scrollbar-color:var(--bdr) transparent;
}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}

.msg{display:flex;flex-direction:column;gap:3px;animation:min .22s ease;}
@keyframes min{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.msg-lbl{font-size:8px;letter-spacing:2px;font-family:var(--mono);color:var(--dim);}
.msg.user .msg-lbl{color:var(--amb);text-align:right;}
.msg.jarvis .msg-lbl{color:var(--c);}

.msg-bub{
  font-size:12.5px;line-height:1.55;
  padding:7px 10px;border-radius:3px;
  max-width:92%;font-weight:400;
}
.msg.user .msg-bub{
  background:rgba(255,183,0,.08);
  border:1px solid rgba(255,183,0,.2);
  align-self:flex-end;color:rgba(255,225,140,.9);
}
.msg.jarvis .msg-bub{
  background:var(--c2);
  border:1px solid var(--bdr);
}
.msg.sys .msg-bub{
  font-family:var(--mono);font-size:9.5px;
  color:var(--dim);border:none;padding:2px 4px;background:transparent;
}

/* confirm card */
.confirm-card{
  background:rgba(255,58,58,.07);
  border:1px solid rgba(255,58,58,.3);
  border-radius:3px;padding:9px 11px;
  font-size:11.5px;line-height:1.55;
  color:rgba(255,200,200,.9);
}
.confirm-btns{display:flex;gap:6px;margin-top:8px;}
.cbtn{
  flex:1;padding:5px;border:1px solid;
  border-radius:3px;background:transparent;
  cursor:pointer;font-family:var(--mono);
  font-size:10px;letter-spacing:1px;transition:all .2s;
}
.cbtn.yes{border-color:var(--c);color:var(--c);}
.cbtn.no {border-color:var(--red);color:var(--red);}
.cbtn.yes:hover{background:var(--c2);}
.cbtn.no:hover {background:rgba(255,58,58,.1);}

/* typing */
.typing-wrap{display:flex;gap:4px;padding:7px 10px;align-items:center;}
.tdot{
  width:5px;height:5px;border-radius:50%;
  background:var(--c);
  animation:td 1s ease-in-out infinite;
}
.tdot:nth-child(2){animation-delay:.15s;}
.tdot:nth-child(3){animation-delay:.3s;}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── AGENT PILLS ── */
.agents{
  display:flex;gap:4px;flex-wrap:wrap;
  padding:6px 12px;border-top:1px solid var(--bdr);flex-shrink:0;
}
.pill{
  font-family:var(--mono);font-size:8px;letter-spacing:1px;
  padding:2px 7px;border-radius:2px;
  border:1px solid var(--bdr);color:var(--dim);
  transition:all .3s;
}
.pill.on{
  border-color:var(--c);color:var(--c);
  background:var(--c2);
  animation:pa 1s ease-in-out infinite;
}
@keyframes pa{0%,100%{opacity:1}50%{opacity:.55}}

/* ── INPUT ── */
.inp-row{
  display:flex;align-items:center;gap:6px;
  padding:8px 10px;
  border-top:1px solid var(--bdr);flex-shrink:0;
}
.inp{
  flex:1;background:var(--bg2);
  border:1px solid var(--bdr);border-radius:3px;
  color:var(--txt);font-family:var(--fn);font-size:12.5px;
  padding:7px 10px;outline:none;transition:border-color .2s;
}
.inp::placeholder{color:var(--dim);font-size:11.5px;}
.inp:focus{border-color:var(--c);box-shadow:0 0 0 1px var(--c2);}
.send{
  width:34px;height:34px;
  border:1px solid var(--c);background:var(--c2);
  border-radius:3px;color:var(--c);
  cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s;flex-shrink:0;
}
.send:hover{background:var(--c3);}
.send svg{width:15px;height:15px;}

/* expand btn */
.expand{
  display:block;width:100%;padding:5px;
  background:transparent;border:none;
  border-top:1px solid var(--bdr);
  color:var(--dim);font-family:var(--mono);
  font-size:8px;letter-spacing:2px;
  cursor:pointer;text-align:center;
  transition:all .2s;flex-shrink:0;
}
.expand:hover{color:var(--c);background:var(--c2);}
</style>
</head>
<body>
<div class="widget">
  <div class="scan"></div>

  <!-- Header -->
  <div class="hdr">
    <div class="logo">
      <div class="orb"><div class="orb-core"></div></div>
      <div>
        <div class="logo-txt">JARVIS</div>
        <div class="logo-sub">INTELLIGENT SYSTEM v3.0</div>
      </div>
    </div>
    <div class="hdr-btns">
      <button class="hbtn" id="btn-mic" title="Voice">🎤</button>
      <button class="hbtn" id="btn-cc"  title="Command Center" onclick="window.jarvis?.toggleCommandCenter()">⬡</button>
      <button class="hbtn" id="btn-min" title="Minimize" onclick="window.jarvis?.minimizeWidget()">−</button>
    </div>
  </div>

  <!-- Status bar -->
  <div class="sbar">
    <div class="sbar-item"><div class="dot" id="d-llm"></div><span>LLM</span></div>
    <div class="sbar-item"><div class="dot warn" id="d-mem"></div><span>MEM</span></div>
    <div class="sbar-item"><div class="dot warn" id="d-voice"></div><span>VOICE</span></div>
    <div class="sbar-right"><span id="clock" style="font-family:var(--mono);font-size:9px"></span></div>
  </div>

  <!-- Waveform -->
  <div class="wave-area" id="wave">
    <div style="display:flex; flex-direction:column; align-items:center; cursor:pointer;" onclick="toggleVoice()">
      <div style="display:flex; gap:3px;">
        <div class="bar" style="--d:.55s;--h:16px"></div>
        <div class="bar" style="--d:.75s;--h:26px"></div>
        <div class="bar" style="--d:.65s;--h:32px"></div>
        <div class="bar" style="--d:.85s;--h:20px"></div>
        <div class="bar" style="--d:.70s;--h:38px"></div>
        <div class="bar" style="--d:.60s;--h:28px"></div>
        <div class="bar" style="--d:.80s;--h:34px"></div>
        <div class="bar" style="--d:.68s;--h:22px"></div>
      </div>
      <span class="mic-hint" id="mic-hint">TAP TO SPEAK</span>
    </div>
    <div style="margin-left:auto; display:flex; flex-direction:column; align-items:center; gap:2px;">
       <input type="checkbox" id="cont-listen" style="cursor:pointer">
       <span style="font-size:7px; color:var(--dim); font-family:var(--mono);">CONT</span>
    </div>
  </div>

  <!-- Messages -->
  <div class="msgs" id="msgs">
    <div class="msg sys"><div class="msg-bub">JARVIS v3.0 — Initializing reactor core...</div></div>
  </div>

  <!-- Agent pills -->
  <div class="agents">
    <div class="pill" data-a="web">WEB</div>
    <div class="pill" data-a="code">CODE</div>
    <div class="pill" data-a="vision">VISION</div>
    <div class="pill" data-a="memory">MEM</div>
    <div class="pill" data-a="system">SYS</div>
    <div class="pill" data-a="browser">BROWSER</div>
    <div class="pill" data-a="android">ANDROID</div>
  </div>

  <!-- Input -->
  <div class="inp-row">
    <input class="inp" id="inp" placeholder="Ask anything or give a command..." autocomplete="off" spellcheck="false">
    <button class="send" onclick="send()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

  <button class="expand" onclick="window.jarvis?.toggleCommandCenter()">▲ OPEN COMMAND CENTER (Ctrl+Space)</button>
</div>

<script>
// ── WebSocket to Electron main ──────────────────────────────────────────────
let ws, pendingId = null, listening = false, retries = 0;

function connect() {
  ws = new WebSocket('ws://127.0.0.1:7475');

  ws.onopen = () => {
    retries = 0;
    ws.send(JSON.stringify({ type: 'get_status' }));
  };

  ws.onmessage = e => {
    try { handle(JSON.parse(e.data)); }
    catch(err) { console.error('WS parse:', err); }
  };

  ws.onerror = () => setDot('d-llm', 'off');

  ws.onclose = () => {
    setDot('d-llm','off');
    if (retries < 10) {
      retries++;
      setTimeout(connect, 2000); // auto-reconnect
    }
  };
}

function wsend(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── Message handler ──────────────────────────────────────────────────────────
function handle(msg) {
  switch(msg.type) {
    case 'backend_status':
      setDot('d-llm', msg.status === 'online' ? 'on' : msg.status === 'starting' ? 'warn' : 'off');
      if (msg.status === 'online') addMsg('sys', 'Backend connected. JARVIS ready.');
      if (msg.status === 'offline') addMsg('sys', 'Backend offline. Start the API server or reopen JARVIS.');
      break;

    case 'jarvis_response':
      removeTyping();
      finishVoiceSession();
      if (msg.type_inner === 'confirmation_required' || msg.message?.includes('CONFIRMATION') || msg.plan) {
        pendingId = msg.task_id;
        addConfirm(msg.message || msg.task_id, msg.task_id);
      } else {
        addMsg('jarvis', msg.message || msg.error || 'Done.');
        pendingId = null;
      }
      flashAgents(msg.steps || []);
      
      // AUTO-RESTART for Continuous Mode
      if (document.getElementById('cont-listen').checked) {
        setTimeout(() => {
            if (!listening) toggleVoice();
        }, 500);
      }
      break;

    case 'status':
      if (msg.llm_ready)    setDot('d-llm',   'on');
      if (msg.memory_ready) setDot('d-mem',   'on');
      if (msg.voice_ready)  setDot('d-voice', 'on');
      break;

    case 'log':
      console.log('[Backend]', msg.message);
      break;
  }
}

// ── Send message ─────────────────────────────────────────────────────────────
function send() {
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if (!txt) return;

  if (pendingId) {
    const yes = /yes|y|ok|confirm|சரி/i.test(txt);
    const no  = /no|n|cancel|வேண்டாம்/i.test(txt);
    if (yes || no) {
      addMsg('user', txt);
      inp.value = '';
      showTyping();
      wsend({ type:'confirm', task_id:pendingId, confirmed: yes });
      pendingId = null;
      return;
    }
  }

  addMsg('user', txt);
  inp.value = '';
  showTyping();
  wsend({ type:'user_input', text:txt });
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ── Voice ────────────────────────────────────────────────────────────────────
function toggleVoice() {
  if (listening) {
    finishVoiceSession();
    wsend({ type:'user_input', text:'__STOP_VOICE__' });
  } else {
    listening = true;
    document.getElementById('wave').classList.add('active');
    document.getElementById('mic-hint').textContent = 'LISTENING...';
    setDot('d-voice','on');
    showTyping();
    wsend({ type:'user_input', text:'__START_VOICE__' });
  }
}
document.getElementById('btn-mic').onclick = toggleVoice;

function finishVoiceSession() {
  listening = false;
  document.getElementById('wave').classList.remove('active');
  document.getElementById('mic-hint').textContent = 'TAP TO SPEAK';
  setDot('d-voice','warn');
}

// ── DOM helpers ───────────────────────────────────────────────────────────────
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const lbl = role === 'user' ? 'YOU' : role === 'jarvis' ? 'JARVIS' : 'SYS';
  d.innerHTML = role !== 'sys'
    ? `<div class="msg-lbl">${lbl}</div><div class="msg-bub">${esc(text)}</div>`
    : `<div class="msg-bub">${esc(text)}</div>`;
  const msgs = document.getElementById('msgs');
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function addConfirm(text, taskId) {
  const d = document.createElement('div');
  d.className = 'msg jarvis';
  d.innerHTML = `
    <div class="msg-lbl">JARVIS — CONFIRMATION REQUIRED</div>
    <div class="confirm-card">
      ${esc(text)}
      <div class="confirm-btns">
        <button class="cbtn yes" onclick="confirm2('${taskId}',true)">✓ YES, DO IT</button>
        <button class="cbtn no"  onclick="confirm2('${taskId}',false)">✗ CANCEL</button>
      </div>
    </div>`;
  const msgs = document.getElementById('msgs');
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function confirm2(id, yes) {
  showTyping();
  wsend({ type:'confirm', task_id:id, confirmed:yes });
  pendingId = null;
}

function showTyping() {
  if (document.getElementById('typing')) return;
  const d = document.createElement('div');
  d.id = 'typing'; d.className = 'msg jarvis';
  d.innerHTML = '<div class="msg-lbl">JARVIS</div><div class="msg-bub"><div class="typing-wrap"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div></div>';
  const msgs = document.getElementById('msgs');
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() { document.getElementById('typing')?.remove(); }

function setDot(id, state) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'dot' + (state === 'off' ? ' off' : state === 'warn' ? ' warn' : '');
}

function flashAgents(steps) {
  const map = { web:'web', code:'code', vision:'vision', memory:'memory', system:'system', browser:'browser', android:'android' };
  steps.forEach(s => {
    const tool = (s.tool || s.step || '').toLowerCase();
    Object.entries(map).forEach(([k,v]) => {
      if (tool.includes(k)) {
        const el = document.querySelector(`[data-a="${v}"]`);
        if (el) {
          el.classList.add('on');
          setTimeout(() => el.classList.remove('on'), 2500);
        }
      }
    });
  });
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function tick() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('en-IN',{hour12:false});
}
setInterval(tick,1000); tick();

// ── Start ─────────────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
